name: Validate sampler with pinned PyTorch
on:
  push:
    branches: [validation/sampler-pinned-20261001]
permissions:
  contents: read
jobs:
  pinned-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      CPU_REGRESSION_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ef1a4b679babd4d77da129692aaec1049ff26f8d
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned core CPU dependencies and test runner
        run: |
          python -m pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest==8.3.5
          python -m pip check
      - name: Record dependency versions and CPU scope
        run: |
          python - <<'PY'
          import sys
          import torch
          import torchaudio
          import pytest
          print("Python:", sys.version)
          print("torch:", torch.__version__)
          print("torchaudio:", torchaudio.__version__)
          print("pytest:", pytest.__version__)
          print("CUDA available:", torch.cuda.is_available())
          assert torch.__version__.split("+")[0] == "2.6.0"
          assert torchaudio.__version__.split("+")[0] == "2.6.0"
          assert not torch.cuda.is_available()
          PY
      - name: Test exact PR head without model or audio pipeline dependencies
        run: python -m pytest -q tests/test_sampler_repetition.py -rs --junitxml="$RUNNER_TEMP/patched.xml"
      - name: Compare original upstream using the same tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import subprocess
          import xml.etree.ElementTree as ET
          temp = Path(os.environ["RUNNER_TEMP"])
          patched = ET.parse(temp / "patched.xml").getroot().find("testsuite")
          assert int(patched.attrib["tests"]) == 66, patched.attrib
          assert int(patched.attrib["failures"]) == 0, patched.attrib
          assert int(patched.attrib["errors"]) == 0, patched.attrib
          assert int(patched.attrib["skipped"]) == 2, patched.attrib
          original = temp / "sampler-original.py"
          original.write_bytes(subprocess.check_output(["git", "show", "349251e1d8f4f98d58fda59246381faecd7392e0:kimia_infer/utils/sampler.py"]))
          report = temp / "original.xml"
          env = dict(os.environ, SAMPLER_SOURCE=str(original))
          result = subprocess.run(["python", "-m", "pytest", "-q", "tests/test_sampler_repetition.py", "-rs", "--junitxml", str(report)], env=env)
          baseline = ET.parse(report).getroot().find("testsuite")
          assert result.returncode == 1, result.returncode
          assert int(baseline.attrib["errors"]) == 0, baseline.attrib
          assert int(baseline.attrib["tests"]) == 66, baseline.attrib
          assert int(baseline.attrib["skipped"]) == 2, baseline.attrib
          assert int(baseline.attrib["failures"]) > 0, baseline.attrib
          failed = [case.attrib["name"] for case in baseline.findall("testcase") if case.find("failure") is not None]
          assert any(name.startswith("test_shared_history_preserves_every_batch_row") for name in failed)
          assert any(name.startswith("test_caller_logits_are_not_mutated") for name in failed)
          assert any(name.startswith("test_penalty_applies_before_at_and_after_window") for name in failed)
          for label, suite in [("PR head", patched), ("Original upstream", baseline)]:
              counts = {key: int(suite.attrib[key]) for key in ("tests", "failures", "errors", "skipped")}
              counts["passed"] = counts["tests"] - counts["failures"] - counts["errors"] - counts["skipped"]
              print(label, counts, flush=True)
          PY
      - name: Confirm submitted sampler and tests are unchanged
        run: git diff --exit-code -- kimia_infer/utils/sampler.py tests/test_sampler_repetition.py
